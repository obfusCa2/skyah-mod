plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// MC version is part of the artifact name so parallel builds for different
// Minecraft versions are distinguishable, e.g.:
//   ./gradlew build -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2
//   ./gradlew build -Pminecraft_version=26.1.2 -Pfabric_api_version=0.155.3+26.1.2
// Test jars carry "-test" in the version and the jar name and log their build
// time, so a log shows which test jar was running. Release builds stay plain.
def testBuild = project.test_build.toBoolean()
def buildStamp = testBuild ? new Date().format('yyyy-MM-dd HH:mm', TimeZone.getTimeZone('UTC')) + ' UTC' : ''
version = "${project.mod_version}${testBuild ? '-test' : ''}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The few Minecraft API calls that differ between versions live in one small
// class (McCompat) with a copy per version family: src/mc26_1 for 26.1.x,
// src/mc26_2 for 26.2.x, src/mc26_3 for 26.3 and newer.
def compatDir = project.minecraft_version.startsWith('26.1') ? 'src/mc26_1/java'
        : project.minecraft_version.startsWith('26.2') ? 'src/mc26_2/java' : 'src/mc26_3/java'
sourceSets {
    main {
        java {
            srcDir(compatDir)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation include("org.java-websocket:Java-WebSocket:1.5.2")
    implementation include("com.google.code.gson:gson:2.10.1")
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "build_stamp", buildStamp
    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
